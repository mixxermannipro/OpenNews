version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Manuel Blasaditsch"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Marke und App-Icons sind nicht mitlizenziert (siehe TRADEMARKS.md).
[[annotations]]
path = [
  "public/logo.png",
  "public/icon.svg",
  "public/pwa-*.png",
  "public/apple-touch-icon.png",
  "apps/website/public/favicon.svg",
  "apps/website/public/icon-*.png",
  "apps/website/public/apple-touch-icon.png",
  "apps/website/public/og/opennews.jpg",
  "native/android/**/ic_launcher*.png",
  "native/android/**/ic_launcher*.webp",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Manuel Blasaditsch"
SPDX-License-Identifier = "NONE"

# Sender- und Verlagslogos sowie App-Vorschaubilder gehören den jeweiligen Rechteinhabern.
[[annotations]]
path = [
  "public/source-icons/**",
  "apps/website/public/screenshots/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Respective rights holders (publishers and broadcasters)"
SPDX-License-Identifier = "NONE"

# Web-Schriften unter SIL Open Font License 1.1.
[[annotations]]
path = [
  "apps/website/public/fonts/schibsted-grotesk-latin.woff2",
  "apps/website/public/fonts/OFL-SchibstedGrotesk.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2023 The Schibsted-Grotesk Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "apps/website/public/fonts/source-serif-4-latin.woff2",
  "apps/website/public/fonts/source-serif-4-italic-latin.woff2",
  "apps/website/public/fonts/OFL-SourceSerif4.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2014 The Source Serif 4 Project Authors"
SPDX-License-Identifier = "OFL-1.1"
