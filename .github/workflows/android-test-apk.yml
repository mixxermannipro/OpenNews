name: OpenNews Android Test APK

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-test-apk.yml'
      - 'src/**'
      - 'scripts/**'
      - 'native/android/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The GitHub Ubuntu runner already includes a supported Android SDK.
      # Avoid setup-android's obsolete "tools" package installation.
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Install icon build tool
        run: sudo apt-get install -y imagemagick

      - name: Sync native web assets
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify release signing with a disposable key
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          umask 077
          export OPENNEWS_UPLOAD_KEYSTORE="$RUNNER_TEMP/opennews-ci-upload.p12"
          export OPENNEWS_UPLOAD_ALIAS=opennews-ci
          export OPENNEWS_CI_KEY_PASSWORD="$(openssl rand -hex 32)"
          trap 'rm -f -- "$OPENNEWS_UPLOAD_KEYSTORE"' EXIT
          keytool -genkeypair -storetype PKCS12 -keystore "$OPENNEWS_UPLOAD_KEYSTORE" \
            -storepass:env OPENNEWS_CI_KEY_PASSWORD -alias "$OPENNEWS_UPLOAD_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=OpenNews CI only'
          npm run android:release -- 1 <<< "$OPENNEWS_CI_KEY_PASSWORD"

      - name: Save APK for PR review
        uses: actions/upload-artifact@v4
        with:
          name: OpenNews-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish private pre-release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.0-alpha.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" android/app/build/outputs/apk/debug/app-debug.apk#OpenNews-debug.apk \
            --target "$GITHUB_SHA" \
            --title "OpenNews $tag – Android Debug Test" \
            --notes "Private Android test build. Signed with the Android debug key; not for Play Store distribution. News feeds are downloaded on-device; some services may be incomplete during alpha testing." \
            --prerelease
