name: OpenNews Android Test APK

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-test-apk.yml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'index.html'
  push:
    branches: [main]
    paths:
      # Publish once after this initial workflow is merged.
      # Later debug releases can be started explicitly via "Run workflow".
      - '.github/workflows/android-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync native web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Save APK for PR review
        uses: actions/upload-artifact@v4
        with:
          name: OpenNews-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish private pre-release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.0-alpha.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" android/app/build/outputs/apk/debug/app-debug.apk#OpenNews-debug.apk \
            --target "$GITHUB_SHA" \
            --title "OpenNews $tag – Android Debug Test" \
            --notes "Private Android test build. Signed with the Android debug key; not for Play Store distribution. News feeds are downloaded on-device; some services may be incomplete during alpha testing." \
            --prerelease
